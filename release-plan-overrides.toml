# Release plan overrides for the 2026-11-27 cut.
#
# cargo-semver-checks is not installed, so the plan sees only new `pub`
# items and the dependency graph. Each entry below corrects it by hand.
[bumps]
# Issue #84 ( PR #86 ) added three variants to `winterbaume_s3::state::S3Error`,
# a public enum without `#[non_exhaustive]`, which breaks exhaustive matches.
# At 1.1.1 the heuristic's `minor` is not a breaking step.
winterbaume-s3 = "major"

# These take `Arc<winterbaume_s3::S3Service>` in public constructors
# ( `S3ControlService::with_s3_service`, the S3 converters' `new` ), so moving
# them onto S3 2.0 breaks callers that pass an S3 1.x service.
winterbaume-s3control = "minor"
winterbaume-terraform = "minor"
