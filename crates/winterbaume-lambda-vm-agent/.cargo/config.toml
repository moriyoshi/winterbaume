# No libc and no C start-up files: link statically with rust-lld. The linker
# is set through rustflags rather than `linker`, because with `--target`
# rustflags do not reach build scripts, which keep linking with the host cc.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "linker=rust-lld", "-C", "linker-flavor=ld.lld", "-C", "link-arg=-static", "-C", "relocation-model=static"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "linker=rust-lld", "-C", "linker-flavor=ld.lld", "-C", "link-arg=-static", "-C", "relocation-model=static"]
